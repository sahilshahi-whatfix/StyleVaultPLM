<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StyleVault PLM</title>
<style>
:root{
  --desk:#e9ecef; --bg:#ffffff; --panel:#f3f4f5; --text:#1f1f1f; --muted:#666b70; --faint:#c3c7cb;
  --border:#a7adb3; --border-soft:#d5d8db; --tb-top:#fdfdfd; --tb-bot:#d7dade;
  --head-top:#eef2f6; --head-bot:#cdd7e1; --hdr-text:#22303d;
  --link:#1a4f9c; --sel:#cfe3fb; --row-alt:#f6f8fa; --hover:#e6effa;
  --green-band:#d6eec3; --green-edge:#3a8a2d; --green-text:#1f4f18;
  --yellow-band:#fbf2c0; --yellow-edge:#e0b40c; --blue-edge:#3a76d6; --faded:#c5c9cd;
  --win-title-top:#6f8fb3; --win-title-bot:#4b6b91;
  --ok:#2d7d32; --run:#b26a00; --queue:#5a6570; --warn:#b3261e; --shadow:rgba(0,0,0,.3);
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--desk);color:var(--text);font:12px/1.35 Tahoma,Verdana,"Segoe UI",Arial,sans-serif}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue-edge);outline-offset:1px}
.window{background:var(--bg);min-height:100%;display:flex;flex-direction:column}
.appbar{display:flex;justify-content:space-between;align-items:center;padding:4px 10px;background:linear-gradient(var(--head-top),var(--head-bot));border-bottom:1px solid var(--border);color:var(--hdr-text)}
.brand{font:bold 15px Georgia,"Times New Roman",serif}
.brand small{font:11px Tahoma,Verdana,sans-serif;color:var(--muted);margin-left:8px}
.appbar .links a{color:var(--link);margin-left:12px;text-decoration:none;cursor:pointer}
.ribbon{display:flex;gap:2px;padding:4px 6px;background:linear-gradient(var(--tb-top),var(--tb-bot));border-bottom:1px solid var(--border);overflow-x:auto}
.rbtn{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:56px;padding:3px 4px;border:1px solid transparent;border-radius:2px;background:none;cursor:pointer;font-size:11px;line-height:1.1}
.rbtn:hover{border-color:var(--border);background:var(--hover)}
.rbtn.on{border-color:var(--border);background:var(--sel)}
.rbtn svg{width:22px;height:22px}
.scrollbar-fake{height:6px;margin:0 6px;background:var(--faint);border-radius:3px}
.body{flex:1;display:flex;min-height:0}
.leftnav{width:190px;border-right:1px solid var(--border);background:var(--panel);padding:6px}
.main{flex:1;min-width:0;padding:8px 10px;overflow:auto}
.statusbar{border-top:1px solid var(--border);background:linear-gradient(var(--tb-top),var(--tb-bot));padding:3px 10px;font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:12px}
.toolbar{display:flex;gap:4px;align-items:center;padding:3px;background:linear-gradient(var(--tb-top),var(--tb-bot));border:1px solid var(--border)}
.lbtn{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border:1px solid var(--border);border-radius:2px;background:linear-gradient(var(--tb-top),var(--tb-bot));cursor:pointer;font-size:11px}
.lbtn:hover{background:var(--hover)}
.lbtn:disabled{opacity:.5;cursor:default}
.lbtn.big{padding:4px 18px;font-size:12px}
.lbtn svg{width:14px;height:14px}
.grip{width:3px;height:16px;border-left:2px dotted var(--muted);margin-right:2px}
.folder-title{font:22px Georgia,"Times New Roman",serif;color:var(--faded);margin:6px 0 4px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:6px}
.tabs span{padding:2px 8px;border:1px solid var(--border);border-bottom:0;background:var(--panel);font-size:11px}
.tabs span.on{background:var(--bg);font-weight:bold;position:relative;top:1px}
.filters{display:grid;grid-template-columns:repeat(6,minmax(110px,1fr));gap:4px 8px;align-items:end;max-width:980px}
.filters label{display:flex;flex-direction:column;font-size:11px;font-weight:bold;gap:1px}
.filters input,.filters select{border:1px solid var(--border);background:var(--bg);padding:1px 3px;height:21px;font-weight:normal}
.pager{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 4px;margin-top:8px;background:linear-gradient(var(--tb-top),var(--tb-bot));border:1px solid var(--border);font-size:11px}
.pager .count{color:#c62828;font-weight:bold}
.pager button{border:1px solid var(--border);background:var(--bg);cursor:pointer;padding:0 5px}
table.grid{border-collapse:collapse;width:100%;font-size:11px}
table.grid th{text-align:left;padding:3px 5px;background:linear-gradient(var(--head-top),var(--head-bot));border:1px solid var(--border-soft);color:var(--hdr-text);white-space:nowrap}
table.grid td{padding:3px 5px;border:1px solid var(--border-soft);vertical-align:top}
table.grid tr:nth-child(even) td{background:var(--row-alt)}
table.grid tbody tr:hover td{background:var(--hover)}
a.lnk{color:var(--link);cursor:pointer;text-decoration:underline}
.wrap{overflow-x:auto}
.detail{display:flex;gap:8px;min-height:100%}
.lpane{width:360px;flex:none;border:1px solid var(--border);display:flex;flex-direction:column;background:var(--bg)}
.rpane{flex:1;min-width:0;border:1px solid var(--border);background:var(--bg);display:flex;flex-direction:column}
.iconbar{display:flex;gap:6px;align-items:center;padding:3px 6px;background:linear-gradient(var(--tb-top),var(--tb-bot));border-bottom:1px solid var(--border)}
.ibtn{width:24px;height:24px;border:1px solid transparent;border-radius:3px;background:none;cursor:pointer;display:grid;place-items:center;padding:0}
.ibtn:hover{border-color:var(--border);background:var(--hover)}
.ibtn svg{width:18px;height:18px}
.band-green{background:var(--green-band);color:var(--green-text);font-weight:bold;padding:4px 8px;border-bottom:1px solid var(--border-soft)}
.band-yellow{background:var(--yellow-band);padding:4px 8px;border-bottom:1px solid var(--border-soft);display:flex;gap:8px;align-items:center;font-weight:bold}
.band-yellow select{border:1px solid var(--border);background:var(--bg);font-weight:normal}
.tree{padding:6px 4px;overflow:auto;flex:1;font-size:13px}
.tree ul{list-style:none;margin:0;padding-left:18px}
.tree>ul{padding-left:2px}
.tree li{margin:2px 0}
.node{display:inline-flex;align-items:center;gap:5px;border:1px solid transparent;padding:0 3px;cursor:pointer;background:none;border-radius:2px;font-weight:bold}
.node:hover{background:var(--hover)}
.node.on{background:var(--sel);border-color:var(--blue-edge)}
.tg{width:11px;height:11px;border:1px solid var(--muted);display:inline-grid;place-items:center;font-size:10px;line-height:1;cursor:pointer;background:var(--bg);padding:0;margin-right:2px}
.bullet{width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#9cc7ff,#1f62c9);display:inline-block;flex:none}
.fold{width:16px;height:13px;flex:none}
.big-faded{font:28px Georgia,"Times New Roman",serif;color:var(--faded);padding:6px 10px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow{display:flex;align-items:center;gap:6px;padding:4px 10px;border-bottom:1px solid var(--border-soft);font-weight:bold;background:linear-gradient(var(--tb-top),var(--tb-bot))}
.rrow .lock{color:var(--warn)}
.rcontent{padding:8px 10px;overflow:auto}
.rcontent h3{font-size:12px;margin:10px 0 4px}
.swatch{display:inline-block;width:12px;height:12px;border:1px solid var(--border);vertical-align:-2px;margin-right:4px}
.createdby{margin:8px 10px;padding:4px 8px;border:1px solid var(--border);border-radius:3px;font-weight:bold;color:var(--muted);background:var(--panel);display:inline-block}
.placeholder{border:1px dashed var(--border);padding:24px;text-align:center;color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.2);display:flex;align-items:flex-start;justify-content:center;padding:40px 12px;z-index:20;overflow:auto}
.win{background:var(--bg);border:1px solid var(--border);box-shadow:0 6px 24px var(--shadow);width:min(760px,100%)}
.wintitle{background:linear-gradient(var(--win-title-top),var(--win-title-bot));color:#fff;padding:4px 8px;font-weight:bold;display:flex;justify-content:space-between;align-items:center}
.wintitle button{background:none;border:1px solid rgba(255,255,255,.5);color:#fff;cursor:pointer;padding:0 6px;border-radius:2px}
.wizbody{padding:8px 10px 14px}
.sect{border-left:8px solid var(--green-edge);padding:6px 10px 8px;margin:8px 0}
.sect.blue{border-left-color:var(--blue-edge)}
.sect.yellow{border-left-color:var(--yellow-edge)}
.sect h4{margin:4px 0 6px;font-size:12px}
.opt{display:flex;align-items:center;gap:6px;margin:3px 0 3px 4px;font-weight:bold;cursor:pointer;width:max-content}
.opt input{margin:0}
.indent{margin-left:22px}
.note{color:var(--muted);font-style:italic;margin:4px 0 0 4px}
.rangeset{display:grid;grid-template-columns:70px 1fr;gap:4px;align-items:start}
table.sizes{border-collapse:collapse;margin-top:6px}
table.sizes th{background:linear-gradient(var(--head-top),var(--head-bot));border:1px solid var(--border-soft);padding:2px 16px;font-size:11px;color:var(--hdr-text)}
table.sizes td{border:1px solid var(--border-soft);padding:2px 6px}
table.colors{border-collapse:collapse;margin-top:8px}
table.colors th{border:1px solid var(--border-soft);padding:3px 10px;font-size:11px;background:var(--panel)}
table.colors td{border:1px solid var(--border-soft);padding:3px 8px;font-size:11px}
.msg{width:min(400px,100%)}
.msg .mb{padding:14px 14px 10px;display:flex;gap:10px;align-items:flex-start}
.msg .mf{padding:0 14px 12px;text-align:right}
.loading{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.35);cursor:progress}
.loading div{background:var(--bg);border:1px solid var(--border);padding:8px 16px;box-shadow:0 2px 10px var(--shadow);display:flex;gap:8px;align-items:center}
.spin{width:14px;height:14px;border:2px solid var(--faint);border-top-color:var(--blue-edge);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
.pill{display:inline-block;padding:0 6px;border-radius:8px;font-weight:bold;font-size:10px;color:#fff}
.pill.Queued{background:var(--queue)} .pill.Running{background:var(--run)} .pill.Complete{background:var(--ok)}
.login{max-width:360px;margin:80px auto;background:var(--bg);border:1px solid var(--border);box-shadow:0 4px 18px var(--shadow)}
.login form{padding:16px 18px;display:grid;gap:10px}
.login label{display:grid;gap:2px;font-weight:bold;font-size:11px}
.login input{border:1px solid var(--border);padding:3px 5px;height:24px;font-weight:normal}
.login .err{color:var(--warn);font-weight:bold}
.badge{display:inline-block;margin-left:8px;padding:0 6px;border:1px solid var(--warn);color:var(--warn);font:bold 10px Tahoma,sans-serif;border-radius:2px;vertical-align:2px}
@media (max-width:820px){.detail{flex-direction:column}.lpane{width:100%}.leftnav{display:none}.filters{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

function mkStyle(o){

  ['batch','Batch Queue','batch'],['bi','BI','BI'],['profile','Profile','profile']];
function ribbonClick(t){ (['home','style','batch','profile'].includes(t)) ? go(t) : go('folder', t); }
function go(view, arg){ withLoad(() => { UI.view = view; if (view === 'folder') UI.folderName = arg; }); }

/* ---------- render ---------- */
function render(){
  let h = plmHTML();
  if (UI.wiz && !(POP && !POP.closed)) h += `<div class="overlay"><div class="win" role="dialog"${AL('Add to style')}>
      <div class="wintitle"><span>StyleVault – Add</span><button${AL('Close')} onclick="wclose()">×</button></div>${wizardInner('')}</div></div>`;
  if (UI.msg) h += `<div class="overlay" style="z-index:40"><div class="win msg" role="alertdialog">
      <div class="wintitle">Message from webpage</div><div class="mb">${I.info}<div>${esc(UI.msg)}</div></div>
      <div class="mf"><button class="lbtn big" id="${ID('msgOK')}" onclick="UI.msg=null;render()">OK</button></div></div></div>`;
  if (UI.loading) h += `<div class="loading" aria-live="polite"><div><span class="spin"></span>Loading…</div></div>`;
  document.getElementById('app').innerHTML = h;
}


function plmHTML(){
  const rib = RIBBON.map(([ic,label,t]) => {
    const on = (t==='home'&&UI.view==='home')||(t==='style'&&(UI.view==='style'||UI.view==='detail'))||(t==='batch'&&UI.view==='batch')||(t==='profile'&&UI.view==='profile')||(UI.view==='folder'&&UI.folderName===t);
    return `<button class="rbtn${on?' on':''}" id="${ID('rb_'+ic)}" onclick="ribbonClick('${t}')">${I[ic]}<span>${label}</span></button>`;
  }).join('');
  const v = UI.view;
  const body = v==='home' ? homeHTML() : `<div class="main">${ v==='style' ? styleFolderHTML() : v==='detail' ? detailHTML() : v==='batch' ? batchHTML() : v==='profile' ? profileHTML() : moduleHTML(UI.folderName) }</div>`;
  return `<div class="window">
    <div class="appbar"><div class="brand">StyleVault<small>Product Lifecycle Management · v9.4</small>${REAL?'<span class="badge">REALISM</span>':''}</div>
      <div class="links">demo.user <a onclick="go('profile')">Profile</a><a onclick="message('Help is not available in this environment.')">Help</a><a onclick="message('Logout is disabled in the demo sandbox.')">Logout</a></div></div>
    <div class="ribbon" role="toolbar">${rib}</div><div class="scrollbar-fake" aria-hidden="true"></div>
    <div class="body">${body}</div>
    <div class="statusbar"><span role="status">${esc(UI.status)}</span><span>Server: PLMPRD02 · Build 9.4.118</span></div></div>`;
}

/* ---------- Style Folder ---------- */
function styleFolderHTML(){
  const s = UI.search;
  const depts = [...new Set(S.styles.map(x => x.dept))].sort();
  const types = [...new Set(S.styles.map(x => x.type))].sort();
  const sel = (k, opts, val) => `<select id="${ID(k)}"><option value=""></option>${opts.map(o=>`<option${o===val?' selected':''}>${esc(o)}</option>`).join('')}</select>`;
  const inp = (k, val) => `<input id="${ID(k)}" value="${esc(val)}" onkeydown="if(event.key==='Enter')doSearch()">`;
  let h = `<div class="toolbar"><span class="grip"></span><button class="lbtn" onclick="message('Creating a new style is not available in this environment.')">new</button>
      <button class="lbtn" onclick="setStatus('Search saved.');render()">save search</button><button class="lbtn" onclick="message('Select a style first.')">copy</button></div>
    <div class="folder-title">Style Folder</div><div class="tabs"><span class="on">Style List View</span><span>Style Thumbnail View</span><span>Calendar</span></div>
    <div class="filters">
      <label>Division${sel('ddlDivision',['Womens Apparel'],'')}</label><label>Style Type${sel('ddlStyleType',types,s.type)}</label>
      <label>Department${sel('ddlDept',depts,s.dept)}</label><label>Style No${inp('txtStyleNo',s.no)}</label>
      <label>Description${inp('txtDesc',s.desc)}</label><label>Line List Desc${inp('txtLineList',s.ll)}</label>
      <label>Fabric Class${sel('ddlFabric',['Knits','Wovens'],'')}</label><label>End Use${sel('ddlEndUse',['Core','Fashion'],'')}</label>
      <label>Size Class${sel('ddlSizeClass',['Regular','Petite','Tall'],'')}</label><label>Style Status${sel('ddlStatus',['Concept','In Progress','Complete'],'')}</label>
      <label>Modified By<input id="${ID('txtModBy')}"></label><label>Month/Year${sel('ddlMonthYear',[],'')}</label></div>
    <div style="margin-top:6px"><button class="lbtn" id="${ID('btnSearch')}" onclick="doSearch()">${I.search} search</button></div>`;
  const r = UI.results, n = r ? r.length : 0, pages = Math.max(1, Math.ceil(n / PAGE)), pg = Math.min(UI.page, pages);
  h += `<div class="pager"><span><input type="checkbox"> Thumbnail? &nbsp;
      <button onclick="pageTo(1)"${pg<=1?' disabled':''}>|◀</button> <button onclick="pageTo(${pg-1})"${pg<=1?' disabled':''}>◀</button>
      | Page ${n?pg:0} of ${n?pages:0} | <button onclick="pageTo(${pg+1})"${pg>=pages?' disabled':''}>▶</button> <button onclick="pageTo(${pages})"${pg>=pages?' disabled':''}>▶|</button>
      <span class="count">${n}</span> Records Found</span><span>Records per Page: <select><option>50</option></select> <button class="lbtn">GO</button></span></div>`;
  if (r) {
    h += `<div class="wrap"><table class="grid"><thead><tr><th>Style No</th><th>Description</th><th>Style Type</th><th>Department</th><th>Fabric Class</th><th>End Use</th><th>Size Class</th><th>Month</th><th>Year</th><th>Line Folder Description</th><th>Style Status</th><th>Modified By</th></tr></thead><tbody>`;
    h += r.slice((pg-1)*PAGE, pg*PAGE).map(x => { const [m,y] = x.month.split(' ');
      return `<tr${REAL?'':` data-style="${x.no}" data-linefolder="${esc(x.folder)}"`}><td><a class="lnk" onclick="openStyle('${x.id}')">${x.no}</a></td><td>${esc(x.desc)}</td><td>${x.type}</td><td>${esc(x.dept)}</td><td>${x.fabric}</td><td>${x.endUse}</td><td>Regular</td><td>${m}</td><td>${y}</td><td><a class="lnk" onclick="openStyle('${x.id}')">${esc(x.folder)}</a></td><td>${x.status}</td><td>${esc(x.modBy)}</td></tr>`; }).join('');
    h += `</tbody></table></div>`;
    if (!n) h += `<p class="note">No styles match. Check the Style No and try again.</p>`;
  }
  return h;
}
function pageTo(p){ withLoad(() => { UI.page = p; }); }
function doSearch(){
  const v = k => (document.getElementById(ID(k)) || {}).value || '';
  UI.search = { no:v('txtStyleNo').trim(), desc:v('txtDesc').trim(), ll:v('txtLineList').trim(), dept:v('ddlDept'), type:v('ddlStyleType') };
  const q = UI.search;
  withLoad(() => {
    if (REAL && Math.random() < 0.08) { UI.results = null; log('Search', 'Request timed out'); UI.msg = 'The request timed out. Please try again.'; return; }
    UI.page = 1;
    UI.results = S.styles.filter(s => (!q.no || s.no.includes(q.no)) && (!q.desc || s.desc.toLowerCase().includes(q.desc.toLowerCase()))
      && (!q.ll || s.folder.toLowerCase().includes(q.ll.toLowerCase())) && (!q.dept || s.dept === q.dept) && (!q.type || s.type === q.type));
    log('Search', `Style No="${q.no}" → ${UI.results.length} record(s)`);
    setStatus(`${UI.results.length} record(s) found.`);
  });
}

    log('Open style', `${s.no} – ${s.folder}`); setStatus(`Style ${s.no} opened (${s.folder}).`); });
}
const isLocked = s => REAL && s.id === LOCKED_STYLE && (S.lockUntil == null || Date.now() < S.lockUntil);
function scForMonth(s, m){ return s.sizeClasses.map((sc,i) => ({sc,i})).filter(o => o.sc.month === m); }
function detailHTML(){
  const s = byId(UI.detail.id), d = UI.detail;
  const months = [...new Set([s.month, ...s.sizeClasses.map(x => x.month)])];
  const list = scForMonth(s, d.month);
  const n = (key,label,icon) => `<button class="node${d.sel===key?' on':''}" onclick="selNode('${key}')">${icon}${esc(label)}</button>`;
  const tg = key => `<button class="tg"${AL(d.collapsed[key]?'Expand':'Collapse')} onclick="toggleNode('${key}')">${d.collapsed[key]?'+':'−'}</button>`;
  const bul = '<span class="bullet"></span>';
  const tree = list.map(({sc,i}) => { const k = String(i);

      <li>${tg(k+':style')}${n(k+':style', s.desc.toLowerCase(), I.folder)}${d.collapsed[k+':style'] ? '' : `<ul>

        <li>${sc.meas.length?tg(k+':meas'):''}${n(k+':meas',`Measurements (${sc.meas.length})`,bul)}${d.collapsed[k+':meas']||!sc.meas.length?'':`<ul>${sc.meas.map((m,j)=>`<li>${n(k+':meas:'+j,m,bul)}</li>`).join('')}</ul>`}</li>
        <li>${tg(k+':cd')}${n(k+':cd','Construction Detail (1)',bul)}${d.collapsed[k+':cd']?'':`<ul><li>${n(k+':cd:0',s.cd,bul)}</li></ul>`}</li>
        <li>${n(k+':imgstyle','Image-Style',bul)}</li></ul>`}</li></ul>`;
    return `<li>${tg(k)}${n(k+':folder', sc.cls, I.folder)}${kids}</li>`; }).join('');

      <div class="band-green">▾ Variation 1</div>
      <div class="band-yellow">${I.sun}<span>Select Month / Year:</span>
        <select id="${ID('ddlVarMonth')}" onchange="withLoad(()=>{UI.detail.month=this.value;UI.detail.sel=''})">${months.map(m=>`<option${m===d.month?' selected':''}>${m}</option>`).join('')}</select></div>
      <div class="tree"><ul>${tree || '<li class="note">No size classes for this month.</li>'}</ul></div></div>
    <div class="rpane">${rightHTML(s, list)}</div></div>`;

function selNode(k){ UI.detail.sel = k; render(); }
function toggleNode(k){ UI.detail.collapsed[k] = !UI.detail.collapsed[k]; render(); }
function rightHTML(s, list){
  const parts = (UI.detail.sel || '').split(':');
  const idx = parts[0] === '' ? (list[0] ? list[0].i : null) : +parts[0];
  const sc = idx != null ? s.sizeClasses[idx] : null, node = parts[1] || 'folder';
  const colorTable = codes => `<table class="grid" style="max-width:520px"><thead><tr><th>Color #</th><th>Color Name</th><th>Status</th></tr></thead><tbody>${codes.map(c=>`<tr><td>${COLORS[c][0]}</td><td><span class="swatch" style="background:${COLORS[c][1]}"></span>${esc(c)}</td><td>Active</td></tr>`).join('')}</tbody></table>`;
  let c = '';
  if (!sc) c = `<p class="note">Select a size class in the tree.</p>`;
  else if (node === 'folder' || node === 'style') c = `<h3>Size class summary</h3><table class="grid" style="max-width:640px"><tbody>
      <tr><th>Size Class</th><td>${sc.cls}</td></tr><tr><th>Size Range</th><td>${sc.range}</td></tr><tr><th>Sizes</th><td>${sc.sizes.join(', ')||'—'}</td></tr>
      <tr><th>Measurements Page</th><td>${sc.meas.join(', ')||'—'}</td></tr><tr><th>Dimensional BOM</th><td>${sc.boms.join(', ')||'—'}</td></tr>
      <tr><th>Month / Year</th><td>${sc.month}</td></tr><tr><th>Created</th><td>${esc(sc.by)} · ${sc.at}</td></tr></tbody></table><h3>Colors</h3>${colorTable(sc.colors)}`;
  else if (node === 'workflow') c = `<h3>Workflow</h3><table class="grid" style="max-width:520px"><thead><tr><th>Step</th><th>Status</th><th>Owner</th></tr></thead><tbody>${[['Concept','Complete'],['Line Review','Complete'],['Fit Approval','In Progress'],['Costing','Not Started'],['Tech Pack Release','Not Started'],['PO Request','Not Started']].map(([a,b])=>`<tr><td>${a}</td><td>${b}</td><td>${esc(s.assigned)}</td></tr>`).join('')}</tbody></table>`;
  else if (node === 'bom') c = (parts[2]!=null?[sc.boms[+parts[2]]]:sc.boms).map(b => `<h3>Dimensional BOM: ${esc(b)}</h3><table class="grid" style="max-width:720px"><thead><tr><th>Component</th><th>Material</th><th>Placement</th><th>Supplier</th><th>Qty</th></tr></thead><tbody>
      <tr><td>Body fabric</td><td>${b.includes('DENIM')?'11oz cotton denim':s.fabric==='Wovens'?'Cotton/linen woven':'Pima cotton jersey'}</td><td>Body</td><td>Supplier 0142</td><td>1.15 yd</td></tr>
      <tr><td>Thread</td><td>Tex 27 poly core</td><td>All seams</td><td>Supplier 0310</td><td>1 cone</td></tr><tr><td>Label</td><td>Woven main label</td><td>Center back</td><td>Supplier 0477</td><td>1 ea</td></tr></tbody></table>`).join('') || '<p class="note">No BOMs.</p>';
  else if (node === 'meas') c = `<h3>${esc(parts[2]!=null?sc.meas[+parts[2]]:'Measurements')}</h3><div class="wrap"><table class="grid"><thead><tr><th>POM</th>${sc.sizes.map(z=>`<th>${z}</th>`).join('')}</tr></thead><tbody>${[['Waist (relaxed)',14],['Hip',19],['Length',26]].map(([p,b])=>`<tr><td>${p}</td>${sc.sizes.map((z,j)=>`<td>${(b+j*0.75).toFixed(2)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  else if (node === 'colorway') c = `<h3>Seasonal Colorway</h3>${colorTable(sc.colors)}`;
  else if (node === 'cd') c = `<h3>Construction Detail</h3><p>${esc(s.cd)} — standard construction per body block.</p>`;
  else c = `<div class="placeholder">No image attached.</div>`;
  const lock = isLocked(s) ? ` / <span class="lock">Checked out by: M. Alvarez</span>` : '';
  return `<div class="iconbar"><button class="lbtn" onclick="message('Edit mode is disabled in the demo sandbox.')">${I.edit} edit</button><button class="lbtn" onclick="message('Preview is not available in this environment.')">${I.pdf} preview</button></div>
    <div class="big-faded">${esc(UI.detail.month)} Assortment</div>
    <div class="rrow"><span class="bullet"></span>Status: ${esc(s.status)} / Assigned To: ${esc(s.assigned)}${lock}</div>
    <div class="rrow">▶ ${s.no} - ${esc(s.desc)} &nbsp;<span style="font-weight:normal;color:var(--muted)">(${esc(s.folder)})</span></div>
    <div class="rrow">▶ ${s.comments} Comment(s).</div><div class="rcontent">${c}</div>
    <div><span class="createdby">Created By: ${esc(s.createdBy)} – ${s.sizeClasses[0].at.split(' ')[0]}</span></div>`;
}

/* ---------- the "+" dialog ---------- */
function openWizard(){
  const s = byId(UI.detail.id);
  if (isLocked(s)) {
    if (S.lockUntil == null) S.lockUntil = Date.now() + 60000;
    log('Add blocked', `${s.no} checked out by M. Alvarez`);
    return message(`Style ${s.no} is checked out by M. Alvarez. Changes can’t be made until the style is checked in.`);
  }
  UI.wiz = { opt:null, copy:null, meas:{}, cls:null, range:null, sizes:{}, month:'', boms:{}, colors:{} };
  s.colors.forEach(c => UI.wiz.colors[c] = true);
  log('Open add dialog', s.no);
  if (REAL) {
    POP = window.open('', 'svAdd', 'width=840,height=780,resizable=yes,scrollbars=yes');
    if (POP) {
      POP.document.open();
      POP.document.write('<!doctype html><html><head><title>StyleVault – Add</title><style>' + document.querySelector('style').textContent + '</style></head><body style="background:#fff"><div id="wizroot"></div></body></html>');
      POP.document.close();
      POP.document.addEventListener('click', () => opener_touch(), true);
      POP.document.addEventListener('keydown', () => opener_touch(), true);
      renderWiz(); return;
    }
    setStatus('Pop-up blocked. The Add dialog opened in this window.');
  }
  render();
}
function opener_touch(){ touch(); }
function popOpen(){ return POP && !POP.closed; }
function renderWiz(){
  if (popOpen()) { POP.document.getElementById('wizroot').innerHTML = wizardInner('opener.'); }
  else render();
}
function wchange(fn){
  if (!REAL) { fn(); renderWiz(); return; }
  UI.wizLoading = true; renderWiz();
  setTimeout(() => { UI.wizLoading = false; if (!UI.wiz) return; fn(); renderWiz(); try { (popOpen() ? POP : window).scrollTo(0,0); } catch(e){} }, 600 + Math.random()*800);
}
function wset(k, v){ wchange(() => { const w = UI.wiz; w[k] = v;
  if (k === 'opt' && v !== 'Size') { w.copy = null; w.cls = null; w.range = null; }
  if (k === 'copy') w.meas = {};
  if (k === 'cls') { w.range = null; w.sizes = {}; }
  if (k === 'range') { w.sizes = {}; RANGES[v].forEach(z => w.sizes[z] = true); } }); }
function wtog(g, key){ wchange(() => { UI.wiz[g][key] = !UI.wiz[g][key]; }); }
function wmonth(v){ wchange(() => { UI.wiz.month = v; }); }
function wclose(){ if (popOpen()) POP.close(); POP = null; UI.wiz = null; log('Add dialog closed', 'Closed without saving'); render(); }
function wizardInner(P){
  const s = byId(UI.detail.id), w = UI.wiz;
  const radio = (name,val,cur,label,fn) => `<label class="opt"><input type="radio" name="${name}" value="${esc(val)}"${cur===val?' checked':''} onchange="${P}${fn}">${esc(label)}</label>`;
  const chk = (name,val,on,fn) => `<label class="opt"><input type="checkbox" name="${name}" value="${esc(val)}"${on?' checked':''} onchange="${P}${fn}">${esc(val)}</label>`;
  let h = `<div class="toolbar" style="border-left:0;border-right:0"><span class="grip"></span>
      <button class="lbtn big" id="${ID('btnSave')}" onclick="${P}wizSave()">${I.save} save</button>
      <button class="lbtn big" id="${ID('btnClose')}" onclick="${P}wclose()">${I.close} close</button>
      <span style="margin-left:10px;color:var(--muted)">${s.no} – ${esc(s.desc)}</span></div><div class="wizbody">
    <div class="sect"><h4>Please select options...</h4>${['Line Plan','Size','Variation'].map(o => radio('opt',o,w.opt,o,`wset('opt','${o}')`)).join('')}
      ${w.opt && w.opt !== 'Size' ? `<p class="note">${w.opt} copy is not enabled for this style.</p>` : ''}</div>`;
  if (w.opt === 'Size') {
    h += `<div class="sect blue"><h4>Select size to copy from...</h4><div class="indent">${scForMonth(s, UI.detail.month).map(({sc,i}) => radio('copy',String(i),w.copy,sc.range,`wset('copy','${i}')`)).join('')}</div>`;
    if (w.copy != null) {
      h += `<h4 style="margin-top:12px">Select Measurements Page...</h4><div class="indent">${s.sizeClasses[+w.copy].meas.map(m => chk('meas',m,w.meas[m],`wtog('meas','${m}')`)).join('')}</div>
        <h4 style="margin-top:12px">Select new size class...</h4>${['Petite','Tall','Womens'].map(c => radio('cls',c,w.cls,c,`wset('cls','${c}')`)).join('')}`;
    }
    if (w.cls) {
      h += `<h4 style="margin-top:12px">Select new size range...</h4><div class="rangeset"><b>1st Set</b><div>${CLASS_RANGES[w.cls].map(r => radio('range',r,w.range,r,`wset('range','${r}')`)).join('')}</div></div>`;
      if (w.range) h += `<table class="sizes"><thead><tr>${RANGES[w.range].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody><tr>${RANGES[w.range].map(x=>`<td><input type="checkbox"${AL('Size '+x)}${w.sizes[x]?' checked':''} onchange="${P}wtog('sizes','${x}')"></td>`).join('')}</tr></tbody></table>`;
    }
    h += `</div>`;
    if (w.range) h += `<div class="sect yellow"><h4>Select Month &amp; Year...</h4>
        <select id="${ID('ddlMonthYear')}" style="border:1px solid var(--border);background:var(--bg);margin-left:4px" onchange="${P}wmonth(this.value)"><option value=""></option>${MONTH_OPTS.map(m=>`<option${m===w.month?' selected':''}>${m}</option>`).join('')}</select>
        <h4 style="margin-top:12px">Select Dimensional BOM...</h4><div class="indent">${s.boms.map(b => chk('bom',b,w.boms[b],`wtog('boms','${b}')`)).join('')}</div>
        <table class="colors"><thead><tr>${s.colors.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>
          <tr>${s.colors.map(c=>`<td><input type="checkbox"${AL('Color '+c)}${w.colors[c]?' checked':''} onchange="${P}wtog('colors','${c}')"></td>`).join('')}</tr>
          <tr>${s.colors.map(c=>`<td><span class="swatch" style="background:${COLORS[c][1]}"></span>${COLORS[c][0]} ${esc(c)}</td>`).join('')}</tr></tbody></table></div>`;
  }
  h += `</div>`;
  if (UI.wizLoading) h += `<div class="loading"><div><span class="spin"></span>Please wait…</div></div>`;
  return h;
}
function wizSave(){
  const s = byId(UI.detail.id), w = UI.wiz;
  const say = t => popOpen() ? POP.alert(t) : message(t);
  if (UI.wizLoading) return;
  if (w.opt !== 'Size') return say('Please select an option to continue.');
  if (w.copy == null) return say('Please select a size to copy from.');
  if (!w.cls) return say('Please select a new size class.');
  if (!w.range) return say('Please select a new size range.');
  if (!w.month) return say('Please select a Month & Year.');
  if (REAL && s.sizeClasses.some(x => x.cls === w.cls && x.month === w.month)) return say(`Size class ${w.cls} already exists for ${w.month}.`);
  const pick = o => Object.keys(o).filter(k => o[k]);
  const sc = { cls:w.cls, range:w.range, sizes:RANGES[w.range].filter(z => w.sizes[z]), meas:pick(w.meas), boms:s.boms.filter(b => w.boms[b]),
    colors:s.colors.filter(c => w.colors[c]), month:w.month, by:'demo.user', at:now() };
  if (popOpen()) POP.close(); POP = null; UI.wiz = null;
  withLoad(() => {
    s.sizeClasses.push(sc); s.modBy = 'demo.user';
    UI.detail.month = sc.month; UI.detail.sel = (s.sizeClasses.length - 1) + ':folder';
    queueJobs(s, sc);
    log('Save size class', `${s.no} ${s.folder} → ${sc.cls} ${sc.range}, ${sc.month}, BOM: ${sc.boms.join('/')||'none'}, Meas: ${sc.meas.join('/')||'none'}`);
    setStatus(`${sc.cls} size class saved for style ${s.no}. Downstream jobs queued.`);
  });
}

/* ---------- Batch Queue ---------- */
function queueJobs(s, sc){
  ['Size class create','Dimensional BOM explode','Costing refresh','PO request to sourcing'].forEach((t, k) => {
    const j = { id:S.jobSeq++, type:t, ref:`${s.no} · ${sc.cls} · ${sc.month}`, status:'Queued', at:now(), by:'demo.user' };
    S.jobs.push(j);
    setTimeout(() => { j.status = 'Running'; if (UI.view === 'batch' && !UI.loading && !UI.wiz) render(); }, 1500 + k*1500);
    setTimeout(() => { j.status = 'Complete'; if (UI.view === 'batch' && !UI.loading && !UI.wiz) render(); }, 3500 + k*2000);
  });
}
function batchHTML(){
  return `<div class="toolbar"><span class="grip"></span><button class="lbtn" onclick="withLoad(()=>setStatus('Batch Queue refreshed.'))">${I.refresh} refresh</button></div>
    <div class="folder-title">Batch Queue</div><div class="wrap"><table class="grid"><thead><tr><th>Job #</th><th>Job Type</th><th>Reference</th><th>Status</th><th>Submitted</th><th>Submitted By</th></tr></thead><tbody>
    ${S.jobs.slice().reverse().map(j=>`<tr><td>${j.id}</td><td>${j.type}</td><td>${esc(j.ref)}</td><td><span class="pill ${j.status}">${j.status}</span></td><td>${j.at}</td><td>${j.by}</td></tr>`).join('') || '<tr><td colspan="6" class="note">No jobs yet. Jobs appear here after a size class is saved.</td></tr>'}</tbody></table></div>`;
}

/* ---------- Profile: sandbox controls + activity log ---------- */
function profileHTML(){
  return `<div class="folder-title">Profile</div>
    <table class="grid" style="max-width:520px"><tbody><tr><th>User</th><td>demo.user</td></tr><tr><th>Role</th><td>Product Development</td></tr><tr><th>Division</th><td>Womens Apparel</td></tr></tbody></table>
    <h3 style="font-size:12px;margin:14px 0 4px">Sandbox settings</h3>
    <label class="opt" style="font-weight:normal"><input type="checkbox"${S.settings.latency?' checked':''} onchange="S.settings.latency=this.checked;setStatus('Settings saved.');render()">Simulate slow page loads</label>
    <label class="opt" style="font-weight:normal"><input type="checkbox"${REAL?' checked':''} onchange="setRealism(this.checked)">Realism mode (pop-up dialog, reloads, changing IDs, locked style, search timeouts)</label>
    <div style="display:flex;gap:6px;margin:10px 0 14px;flex-wrap:wrap">
      <button class="lbtn big" onclick="doReset()">Reset sandbox data</button>
      <button class="lbtn big" onclick="downloadCSV('activity_log.csv',['at','action','detail'],S.log)">Download activity log (.csv)</button>
      <button class="lbtn big" onclick="downloadCSV('size_classes_created.csv',['style','line_folder','size_class','range','sizes','measurements','boms','colors','month','created_by','created_at'],createdSizeClasses())">Download size classes created (.csv)</button></div>
    <h3 style="font-size:12px;margin:0 0 4px">Activity log</h3><div class="wrap"><table class="grid"><thead><tr><th>Time</th><th>Action</th><th>Detail</th></tr></thead><tbody>
      ${S.log.map(l=>`<tr><td>${l.at}</td><td>${esc(l.action)}</td><td>${esc(l.detail)}</td></tr>`).join('') || '<tr><td colspan="3" class="note">No activity yet.</td></tr>'}</tbody></table></div>`;
}
function setRealism(on){ const u = new URL(location.href); on ? u.searchParams.delete('realism') : u.searchParams.set('realism','0'); location.href = u.toString(); }
function createdSizeClasses(){
  const out = [];
  S.styles.forEach(s => s.sizeClasses.filter(sc => sc.by !== 'Seed load').forEach(sc => out.push({ style:s.no, line_folder:s.folder, size_class:sc.cls, range:sc.range,
    sizes:sc.sizes.join(' '), measurements:sc.meas.join(' / '), boms:sc.boms.join(' / '), colors:sc.colors.join(' / '), month:sc.month, created_by:sc.by, created_at:sc.at })));
  return out;
}
function doReset(){ reset(); UI.view = 'profile'; setStatus('Sandbox data reset to seed.'); render(); }
function csvCell(v){ v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; }
function downloadCSV(file, cols, rows){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([[cols.join(',')].concat(rows.map(r => cols.map(c => csvCell(r[c])).join(','))).join('\n')], {type:'text/csv'}));
  a.download = file; document.body.appendChild(a); a.click(); a.remove();
}

render();
</script>
</body>
</html>
